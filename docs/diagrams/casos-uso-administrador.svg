<svg viewBox="0 0 950 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1C1C1E" flood-opacity="0.16"/>
    </filter>
    <filter id="shadowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#1C1C1E" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="950" height="640" fill="#ffffff"/>

  <!-- Header -->
  <rect x="40" y="34" width="6" height="34" rx="3" fill="#007AFF"/>
  <text x="58" y="58" font-size="24" font-weight="700" fill="#1C1C1E">Casos de uso &#8212; Administrador</text>
  <text x="58" y="78" font-size="13" fill="#8E8E93">CMEDriver v2 &#183; configuracion y gobierno de la plataforma</text>

  <!-- System boundary -->
  <rect x="250" y="105" width="590" height="460" rx="18" fill="#FAFBFC" stroke="#E2E5EA" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="272" y="133" font-size="14.5" font-weight="700" fill="#1C1C1E">Sistema CMEDriver</text>
  <text x="272" y="150" font-size="11.5" fill="#9AA1AC">Backend Django + panel de administracion</text>

  <!-- ================= ASSOCIATION LINES ================= -->
  <g stroke="#AEAEB2" stroke-width="1.6" fill="none">
    <line x1="120" y1="320" x2="305" y2="140"/>
    <line x1="120" y1="320" x2="305" y2="230"/>
    <line x1="120" y1="320" x2="305" y2="320"/>
    <line x1="120" y1="320" x2="300" y2="410"/>
    <line x1="120" y1="320" x2="300" y2="500"/>
  </g>

  <!-- ================= USE CASES ================= -->
  <g font-size="14" fill="#1C1C1E" font-weight="600">
    <ellipse cx="430" cy="140" rx="125" ry="37" fill="#E8F2FF" stroke="#007AFF" stroke-width="1.75" filter="url(#shadow)"/>
    <text x="430" y="146" text-anchor="middle">Gestionar usuarios</text>

    <ellipse cx="430" cy="230" rx="125" ry="37" fill="#E8F2FF" stroke="#007AFF" stroke-width="1.75" filter="url(#shadow)"/>
    <text x="430" y="225" text-anchor="middle">Configurar matriz</text>
    <text x="430" y="243" text-anchor="middle">de cobertura</text>

    <ellipse cx="430" cy="320" rx="125" ry="37" fill="#E8F2FF" stroke="#007AFF" stroke-width="1.75" filter="url(#shadow)"/>
    <text x="430" y="326" text-anchor="middle">Gestionar inventario</text>

    <ellipse cx="430" cy="410" rx="130" ry="39" fill="#E8F2FF" stroke="#007AFF" stroke-width="1.75" filter="url(#shadow)"/>
    <text x="430" y="405" text-anchor="middle">Gestionar API keys</text>
    <text x="430" y="423" text-anchor="middle">y webhooks</text>
    <text x="430" y="438" text-anchor="middle" font-size="10.5" font-weight="500" fill="#0051D5">v2</text>

    <!-- Shared -->
    <ellipse cx="430" cy="500" rx="135" ry="39" fill="#F2F2F7" stroke="#C7C7CC" stroke-width="1.75" filter="url(#shadow)"/>
    <text x="430" y="495" text-anchor="middle" fill="#48484A">Recuperar contrasena</text>
    <text x="430" y="513" text-anchor="middle" font-size="10.5" font-weight="500" fill="#8E8E93">(compartido &#183; los 4 roles)</text>
  </g>

  <!-- ================= ACTOR ================= -->
  <circle cx="120" cy="320" r="46" fill="#E8F2FF" filter="url(#shadowSoft)"/>
  <g stroke="#0051D5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="120" cy="292" r="13" fill="#ffffff"/>
    <line x1="120" y1="305" x2="120" y2="336"/>
    <line x1="99" y1="316" x2="141" y2="316"/>
    <line x1="120" y1="336" x2="102" y2="362"/>
    <line x1="120" y1="336" x2="138" y2="362"/>
  </g>
  <text x="120" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="#0051D5">Administrador</text>
  <text x="120" y="409" text-anchor="middle" font-size="11" fill="#8E8E93">(actor principal)</text>

  <!-- ================= LEGEND ================= -->
  <g font-size="12" fill="#1C1C1E">
    <rect x="250" y="595" width="16" height="16" rx="4" fill="#E8F2FF" stroke="#007AFF"/>
    <text x="273" y="608">Casos de uso &#8212; Administrador</text>
    <rect x="480" y="595" width="16" height="16" rx="4" fill="#F2F2F7" stroke="#C7C7CC"/>
    <text x="503" y="608" fill="#48484A">Compartido / interno</text>
  </g>
</svg>
