<svg viewBox="0 0 970 680" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1C1C1E" flood-opacity="0.16"/>
    </filter>
    <filter id="shadowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#1C1C1E" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#FF3B30"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="970" height="680" fill="#ffffff"/>

  <!-- Header -->
  <rect x="40" y="34" width="6" height="34" rx="3" fill="#FF9500"/>
  <text x="58" y="58" font-size="24" font-weight="700" fill="#1C1C1E">Casos de uso — Alistador</text>
  <text x="58" y="78" font-size="13" fill="#8E8E93">CMEDriver v2 · creacion, asignacion y optimizacion de servicios</text>

  <!-- System boundary -->
  <rect x="250" y="105" width="650" height="420" rx="18" fill="#FAFBFC" stroke="#E2E5EA" stroke-width="1.5" filter="url(#shadowSoft)"/>
  <text x="272" y="133" font-size="14.5" font-weight="700" fill="#1C1C1E">Sistema CMEDriver</text>
  <text x="272" y="150" font-size="11.5" fill="#9AA1AC">Backend Django + panel de alistador</text>

  <!-- ================= ASSOCIATION LINES ================= -->
  <g stroke="#AEAEB2" stroke-width="1.6" fill="none">
    <line x1="120" y1="310" x2="305" y2="160"/>
    <line x1="120" y1="310" x2="305" y2="260"/>
    <line x1="120" y1="310" x2="305" y2="360"/>
    <line x1="120" y1="310" x2="300" y2="460"/>
  </g>
  <line x1="120" y1="545" x2="305" y2="160" stroke="#AEAEB2" stroke-width="1.6" stroke-dasharray="2 4" fill="none"/>

  <!-- ================= INCLUDE ================= -->
  <path d="M 555,160 C 590,160 600,160 630,160" stroke="#FF3B30" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="558" y="140" width="72" height="16" rx="8" fill="#ffffff"/>
  <text x="594" y="152" text-anchor="middle" font-size="11" font-style="italic" fill="#FF3B30">&#171;include&#187;</text>

  <!-- ================= USE CASES ================= -->
  <g font-size="14" fill="#1C1C1E" font-weight="600">
    <ellipse cx="430" cy="160" rx="125" ry="37" fill="#FFF3E0" stroke="#FF9500" stroke-width="1.75" filter="url(#shadow)"/>
    <text x="430" y="166" text-anchor="middle">Crear servicio</text>

    <ellipse cx="430" cy="260" rx="125" ry="37" fill="#FFF3E0" stroke="#FF9500" stroke-width="1.75" filter="url(#shadow)"/>
    <text x="430" y="255" text-anchor="middle">Asignar servicio</text>
    <text x="430" y="273" text-anchor="middle">a ruta</text>

    <ellipse cx="430" cy="360" rx="125" ry="37" fill="#FFF3E0" stroke="#FF9500" stroke-width="1.75" filter="url(#shadow)"/>
    <text x="430" y="355" text-anchor="middle">Optimizar ruta</text>
    <text x="430" y="373" text-anchor="middle" font-size="10.5" font-weight="500" fill="#B36200">v2 · sugerencia, no persiste</text>

    <!-- Shared -->
    <ellipse cx="430" cy="460" rx="135" ry="39" fill="#F2F2F7" stroke="#C7C7CC" stroke-width="1.75" filter="url(#shadow)"/>
    <text x="430" y="455" text-anchor="middle" fill="#48484A">Recuperar contrasena</text>
    <text x="430" y="473" text-anchor="middle" font-size="10.5" font-weight="500" fill="#8E8E93">(compartido · los 4 roles)</text>

    <ellipse cx="760" cy="160" rx="125" ry="38" fill="#F2F2F7" stroke="#C7C7CC" stroke-width="1.75" filter="url(#shadow)"/>
    <text x="760" y="155" text-anchor="middle" fill="#48484A">Validar cobertura</text>
    <text x="760" y="173" text-anchor="middle" fill="#48484A">y leadtime</text>
  </g>

  <!-- ================= ACTORS ================= -->
  <circle cx="120" cy="310" r="46" fill="#FFF3E0" filter="url(#shadowSoft)"/>
  <g stroke="#B36200" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="120" cy="282" r="13" fill="#ffffff"/>
    <line x1="120" y1="295" x2="120" y2="326"/>
    <line x1="99" y1="306" x2="141" y2="306"/>
    <line x1="120" y1="326" x2="102" y2="352"/>
    <line x1="120" y1="326" x2="138" y2="352"/>
  </g>
  <text x="120" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#B36200">Alistador</text>
  <text x="120" y="399" text-anchor="middle" font-size="11" fill="#8E8E93">(actor principal)</text>

  <circle cx="120" cy="545" r="40" fill="#F2F2F7" filter="url(#shadowSoft)"/>
  <g stroke="#8E8E93" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="3 3">
    <circle cx="120" cy="520" r="11" fill="#ffffff"/>
    <line x1="120" y1="531" x2="120" y2="557"/>
    <line x1="102" y1="541" x2="138" y2="541"/>
    <line x1="120" y1="557" x2="105" y2="579"/>
    <line x1="120" y1="557" x2="135" y2="579"/>
  </g>
  <text x="120" y="605" text-anchor="middle" font-size="13" font-weight="700" fill="#8E8E93">Sistema externo</text>
  <text x="120" y="621" text-anchor="middle" font-size="11" fill="#8E8E93">(actor secundario · vía API Key)</text>

  <!-- ================= LEGEND ================= -->
  <g font-size="12" fill="#1C1C1E">
    <rect x="250" y="652" width="16" height="16" rx="4" fill="#FFF3E0" stroke="#FF9500"/>
    <text x="273" y="665">Casos de uso — Alistador</text>
    <rect x="470" y="652" width="16" height="16" rx="4" fill="#F2F2F7" stroke="#C7C7CC"/>
    <text x="493" y="665" fill="#48484A">Compartido / interno</text>
    <line x1="670" y1="660" x2="702" y2="660" stroke="#FF3B30" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="710" y="665" fill="#48484A">«include» / «extend»</text>
  </g>
</svg>
