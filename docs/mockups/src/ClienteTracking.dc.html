<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --blue:#007AFF; --blue-bg:#E8F2FF;
      --bg:#F2F2F7; --surface:#FFFFFF; --border:#E2E5EA;
      --text:#1C1C1E; --text-2:#8E8E93; --text-3:#9AA1AC; --amber:#FF9500;
    }
    *{box-sizing:border-box;}
    body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    .badge{display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:99px; color:#fff;}
  </style>
</helmet>

<div style="width:390px; height:844px; background:var(--bg); display:flex; flex-direction:column; overflow:hidden;">

  <div style="background:var(--blue); padding:16px 18px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0;">
    <div>
      <div style="color:#fff; font-size:15.5px; font-weight:700;">Servicio #8</div>
      <div style="color:#dbe6ff; font-size:11.5px;">Recoleccion en curso</div>
    </div>
    <span class="badge" style="background:var(--amber);">EN TRANSITO</span>
  </div>

  <!-- Map -->
  <div style="height:300px; position:relative; background:#dfe6ee; flex-shrink:0; overflow:hidden;">
    <div style="position:absolute; inset:0; background:
      repeating-linear-gradient(0deg, transparent, transparent 38px, #cfd8e3 38px, #cfd8e3 40px),
      repeating-linear-gradient(90deg, transparent, transparent 58px, #cfd8e3 58px, #cfd8e3 60px);"></div>
    <div style="position:absolute; left:10%; top:65%; width:80%; height:14px; background:#c3cddb; border-radius:3px; transform:rotate(-4deg);"></div>
    <div style="position:absolute; left:35%; top:10%; width:14px; height:85%; background:#c3cddb; border-radius:3px;"></div>

    <svg style="position:absolute; inset:0;" width="390" height="300" viewBox="0 0 390 300">
      <path d="M60 230 C 120 180, 160 160, 200 120 S 280 70, 320 55" fill="none" stroke="#007AFF" stroke-width="3.5" stroke-dasharray="2 10" stroke-linecap="round"/>
    </svg>

    <div style="position:absolute; left:52px; top:214px; width:16px; height:16px; border-radius:50%; background:#007AFF; border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.3);"></div>
    <div style="position:absolute; left:308px; top:38px; display:flex; flex-direction:column; align-items:center;">
      <div style="width:30px; height:30px; border-radius:50% 50% 50% 0; background:var(--blue); transform:rotate(45deg); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.25);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff" style="transform:rotate(-45deg);"><circle cx="12" cy="12" r="6"/></svg>
      </div>
    </div>

    <div style="position:absolute; left:14px; bottom:14px; background:#fff; border-radius:10px; padding:9px 12px; box-shadow:0 2px 8px rgba(20,23,31,.15); display:flex; align-items:center; gap:8px;">
      <div style="width:8px; height:8px; border-radius:50%; background:#34C759;"></div>
      <div style="font-size:12.5px; font-weight:600; color:var(--text);">Mario esta a ~5 min</div>
    </div>
  </div>

  <!-- Chat -->
  <div style="flex:1; display:flex; flex-direction:column; background:var(--surface); overflow:hidden;">
    <div style="padding:10px 16px; border-bottom:1px solid var(--border); font-size:12.5px; font-weight:700; color:var(--text-2); text-transform:uppercase; letter-spacing:.3px;">Chat con Mario</div>

    <div style="flex:1; overflow:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px;">
      <div style="align-self:flex-start; background:var(--bg); border-radius:12px 12px 12px 3px; padding:9px 13px; font-size:13.5px; color:var(--text); max-width:75%;">Voy en camino, llego en unos minutos</div>
      <div style="align-self:flex-end; background:var(--blue); color:#fff; border-radius:12px 12px 3px 12px; padding:9px 13px; font-size:13.5px; max-width:75%;">Perfecto, te espero en la portería</div>
      <div style="align-self:flex-start; background:var(--bg); border-radius:12px 12px 12px 3px; padding:9px 13px; font-size:13.5px; color:var(--text); max-width:75%;">Listo, ya casi llego</div>
    </div>

    <div style="padding:12px 16px 18px; border-top:1px solid var(--border); display:flex; gap:10px; align-items:center;">
      <div style="flex:1; background:var(--bg); border-radius:20px; padding:10px 15px; font-size:13px; color:var(--text-3);">Escribe un mensaje...</div>
      <div style="width:36px; height:36px; border-radius:50%; background:var(--blue); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
