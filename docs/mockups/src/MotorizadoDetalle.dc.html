<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --blue:#007AFF; --blue-bg:#E8F2FF;
      --bg:#F2F2F7; --surface:#FFFFFF; --border:#E2E5EA;
      --text:#1C1C1E; --text-2:#8E8E93; --text-3:#9AA1AC;
      --violet:#AF52DE; --amber:#FF9500; --green:#34C759; --red:#FF3B30;
    }
    *{box-sizing:border-box;}
    body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    .badge{display:inline-block; font-size:11px; font-weight:700; padding:4px 10px; border-radius:99px; color:#fff;}
  </style>
</helmet>

<div style="width:390px; height:844px; background:var(--bg); display:flex; flex-direction:column; overflow:hidden;">

  <div style="background:var(--blue); padding:18px 18px 14px; display:flex; align-items:center; gap:12px; flex-shrink:0;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div style="color:#fff; font-size:16px; font-weight:700;">Servicio #8</div>
  </div>

  <div style="flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:14px;">

    <div style="background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <span class="badge" style="background:var(--violet);">RECOLECCION</span>
        <span class="badge" style="background:var(--amber);">EN TRANSITO</span>
      </div>
      <div style="font-size:12px; color:var(--text-2); margin-bottom:2px;">Direccion de recoleccion</div>
      <div style="font-size:14.5px; font-weight:600; color:var(--text); margin-bottom:10px;">Direccion recoleccion test, Bogota</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:12.5px;">
        <div><div style="color:var(--text-2);">Cliente</div><div style="font-weight:600; color:var(--text);">Carla Cliente</div></div>
        <div><div style="color:var(--text-2);">Zona</div><div style="font-weight:600; color:var(--text);">Bogota - Chapinero</div></div>
      </div>
    </div>

    <div style="font-size:13px; font-weight:700; color:var(--text); margin-top:2px;">Evidencia requerida para cerrar</div>

    <div style="background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px;">
      <div style="font-size:12.5px; font-weight:600; color:var(--text-2); margin-bottom:8px;">Foto del producto</div>
      <div style="height:110px; border-radius:9px; background:linear-gradient(135deg,#e5e9f0,#d7dce6); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8b93a3" stroke-width="1.6"><rect x="2" y="6" width="20" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
      </div>
      <div style="display:flex; align-items:center; gap:6px; margin-top:8px; color:var(--green); font-size:12.5px; font-weight:600;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
        Foto capturada
      </div>
    </div>

    <div style="background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px;">
      <div style="font-size:12.5px; font-weight:600; color:var(--text-2); margin-bottom:8px;">Firma del cliente</div>
      <div style="height:110px; border-radius:9px; background:#fff; border:1.5px dashed var(--border); display:flex; align-items:center; justify-content:center;">
        <svg width="140" height="50" viewBox="0 0 140 50"><path d="M8 38 C 18 12, 28 12, 34 30 S 48 42, 55 24 S 70 8, 78 30 S 95 40, 105 20 S 120 10, 132 26" fill="none" stroke="#0051D5" stroke-width="2.2" stroke-linecap="round"/></svg>
      </div>
      <div style="display:flex; align-items:center; gap:6px; margin-top:8px; color:var(--green); font-size:12.5px; font-weight:600;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
        Firma capturada
      </div>
    </div>

  </div>

  <div style="padding:14px 16px 20px; display:flex; flex-direction:column; gap:10px; flex-shrink:0; background:var(--surface); border-top:1px solid var(--border);">
    <div style="background:var(--blue); color:#fff; text-align:center; font-weight:700; font-size:14.5px; padding:13px; border-radius:10px;">Confirmar cierre (recolectado)</div>
    <div style="background:#fff; border:1px solid var(--red); color:var(--red); text-align:center; font-weight:600; font-size:13.5px; padding:11px; border-radius:10px;">Registrar novedad</div>
  </div>
</div>
</x-dc>
</body>
</html>
