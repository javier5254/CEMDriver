<svg viewBox="0 0 1200 650" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowC1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Diagrama de contexto (C1) — CMEDriver</text>

  <!-- ===== Relationship lines (drawn first so boxes sit on top) ===== -->
  <g stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arrowC1)">
    <path d="M174,160 L 430,255"/>
    <path d="M458,160 L 500,255"/>
    <path d="M742,160 L 700,255"/>
    <path d="M1026,160 L 790,255"/>
    <path d="M430,390 L 430,478"/>
    <path d="M770,390 L 770,478"/>
  </g>
  <g font-size="12" fill="#334155">
    <rect x="120" y="185" width="128" height="16" fill="#ffffff"/>
    <text x="184" y="197" text-anchor="middle">Configura [HTTPS]</text>

    <rect x="395" y="200" width="180" height="16" fill="#ffffff"/>
    <text x="485" y="212" text-anchor="middle">Crea y asigna servicios [HTTPS]</text>

    <rect x="640" y="200" width="205" height="16" fill="#ffffff"/>
    <text x="742" y="212" text-anchor="middle">Ejecuta servicios, reporta GPS [HTTPS]</text>

    <rect x="880" y="185" width="185" height="16" fill="#ffffff"/>
    <text x="972" y="197" text-anchor="middle">Solicita y sigue servicios [HTTPS]</text>

    <rect x="370" y="425" width="150" height="16" fill="#ffffff"/>
    <text x="445" y="437" text-anchor="middle">Crea servicios [API]</text>

    <rect x="710" y="425" width="130" height="16" fill="#ffffff"/>
    <text x="775" y="437" text-anchor="middle">Obtiene mapas</text>
  </g>

  <!-- ===== Person boxes ===== -->
  <g font-size="13">
    <!-- Administrador -->
    <rect x="64" y="40" width="220" height="110" rx="6" fill="#08427b" stroke="#052e56"/>
    <circle cx="174" cy="62" r="10" fill="#ffffff"/>
    <path d="M 160,86 a14,14 0 0 1 28,0 z" fill="#ffffff"/>
    <text x="174" y="105" text-anchor="middle" font-weight="700" fill="#ffffff">Administrador</text>
    <text x="174" y="122" text-anchor="middle" font-size="10.5" fill="#cfe0f2" font-style="italic">[Persona]</text>
    <text x="174" y="138" text-anchor="middle" font-size="11" fill="#e8f0fa">Configura usuarios y</text>
    <text x="174" y="152" text-anchor="middle" font-size="11" fill="#e8f0fa">cobertura</text>

    <!-- Alistador -->
    <rect x="348" y="40" width="220" height="110" rx="6" fill="#08427b" stroke="#052e56"/>
    <circle cx="458" cy="62" r="10" fill="#ffffff"/>
    <path d="M 444,86 a14,14 0 0 1 28,0 z" fill="#ffffff"/>
    <text x="458" y="105" text-anchor="middle" font-weight="700" fill="#ffffff">Alistador</text>
    <text x="458" y="122" text-anchor="middle" font-size="10.5" fill="#cfe0f2" font-style="italic">[Persona]</text>
    <text x="458" y="138" text-anchor="middle" font-size="11" fill="#e8f0fa">Crea y asigna</text>
    <text x="458" y="152" text-anchor="middle" font-size="11" fill="#e8f0fa">servicios</text>

    <!-- Motorizado -->
    <rect x="632" y="40" width="220" height="110" rx="6" fill="#08427b" stroke="#052e56"/>
    <circle cx="742" cy="62" r="10" fill="#ffffff"/>
    <path d="M 728,86 a14,14 0 0 1 28,0 z" fill="#ffffff"/>
    <text x="742" y="105" text-anchor="middle" font-weight="700" fill="#ffffff">Motorizado</text>
    <text x="742" y="122" text-anchor="middle" font-size="10.5" fill="#cfe0f2" font-style="italic">[Persona]</text>
    <text x="742" y="138" text-anchor="middle" font-size="11" fill="#e8f0fa">Ejecuta servicios</text>
    <text x="742" y="152" text-anchor="middle" font-size="11" fill="#e8f0fa">en campo</text>

    <!-- Cliente -->
    <rect x="916" y="40" width="220" height="110" rx="6" fill="#08427b" stroke="#052e56"/>
    <circle cx="1026" cy="62" r="10" fill="#ffffff"/>
    <path d="M 1012,86 a14,14 0 0 1 28,0 z" fill="#ffffff"/>
    <text x="1026" y="105" text-anchor="middle" font-weight="700" fill="#ffffff">Cliente</text>
    <text x="1026" y="122" text-anchor="middle" font-size="10.5" fill="#cfe0f2" font-style="italic">[Persona]</text>
    <text x="1026" y="138" text-anchor="middle" font-size="11" fill="#e8f0fa">Solicita servicios y</text>
    <text x="1026" y="152" text-anchor="middle" font-size="11" fill="#e8f0fa">hace seguimiento</text>
  </g>

  <!-- ===== CMEDriver system ===== -->
  <g>
    <rect x="350" y="255" width="500" height="135" rx="6" fill="#1168bd" stroke="#0b4884"/>
    <text x="600" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Plataforma CMEDriver</text>
    <text x="600" y="308" text-anchor="middle" font-size="11" font-style="italic" fill="#cfe0f2">[Sistema de software]</text>
    <text x="600" y="330" text-anchor="middle" font-size="12" fill="#eaf2fb">Gestiona servicios de mensajeria: entregas y</text>
    <text x="600" y="347" text-anchor="middle" font-size="12" fill="#eaf2fb">recolecciones, tracking, chatbot e inventario</text>
    <text x="600" y="368" text-anchor="middle" font-size="11" fill="#cfe0f2">(inventario administrado exclusivamente por el Administrador)</text>
  </g>

  <!-- ===== External systems ===== -->
  <g font-size="13">
    <rect x="300" y="478" width="260" height="110" rx="6" fill="#8a8a8a" stroke="#666666"/>
    <text x="430" y="512" text-anchor="middle" font-weight="700" fill="#ffffff">Sistema externo</text>
    <text x="430" y="529" text-anchor="middle" font-size="10.5" font-style="italic" fill="#eeeeee">[Sistema de software - Externo]</text>
    <text x="430" y="550" text-anchor="middle" font-size="11" fill="#f3f3f3">E-commerce / ERP que crea</text>
    <text x="430" y="565" text-anchor="middle" font-size="11" fill="#f3f3f3">servicios via API</text>

    <rect x="640" y="478" width="260" height="110" rx="6" fill="#8a8a8a" stroke="#666666"/>
    <text x="770" y="512" text-anchor="middle" font-weight="700" fill="#ffffff">OpenStreetMap</text>
    <text x="770" y="529" text-anchor="middle" font-size="10.5" font-style="italic" fill="#eeeeee">[Sistema de software - Externo]</text>
    <text x="770" y="550" text-anchor="middle" font-size="11" fill="#f3f3f3">Servicio de mapas (tiles)</text>
    <text x="770" y="565" text-anchor="middle" font-size="11" fill="#f3f3f3">para el tracking</text>
  </g>

  <!-- ===== Legend ===== -->
  <g font-size="11" fill="#334155">
    <rect x="64" y="612" width="16" height="16" fill="#08427b"/>
    <text x="86" y="624">Persona (actor)</text>
    <rect x="220" y="612" width="16" height="16" fill="#1168bd"/>
    <text x="242" y="624">Sistema (en alcance)</text>
    <rect x="410" y="612" width="16" height="16" fill="#8a8a8a"/>
    <text x="432" y="624">Sistema externo</text>
  </g>
</svg>
