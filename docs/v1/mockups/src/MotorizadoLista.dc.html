<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --blue:#1D4ED8; --blue-bg:#EFF4FF;
      --bg:#F4F6F9; --surface:#FFFFFF; --border:#E2E5EA;
      --text:#14171F; --text-2:#6B7280; --text-3:#9AA1AC;
      --gray:#6B7280; --violet:#7C3AED; --amber:#D97706; --green:#16A34A; --red:#DC2626;
    }
    *{box-sizing:border-box;}
    body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    .badge{display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:99px; color:#fff;}
    .card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; display:flex; gap:12px;}
  </style>
</helmet>

<div style="width:390px; height:844px; background:var(--bg); display:flex; flex-direction:column; overflow:hidden;">

  <div style="background:var(--blue); padding:20px 18px 16px; flex-shrink:0;">
    <div style="color:#fff; font-size:12px; opacity:.85; margin-bottom:2px;">Hola, Mario</div>
    <div style="color:#fff; font-size:19px; font-weight:700;">Mis servicios de hoy</div>
  </div>

  <div style="display:flex; gap:10px; padding:14px 18px 6px; flex-shrink:0;">
    <div style="flex:1; background:#fff; border:1px solid var(--border); border-radius:10px; padding:10px; text-align:center;">
      <div style="font-size:20px; font-weight:700; color:var(--text);">4</div>
      <div style="font-size:11px; color:var(--text-2);">Pendientes</div>
    </div>
    <div style="flex:1; background:#fff; border:1px solid var(--border); border-radius:10px; padding:10px; text-align:center;">
      <div style="font-size:20px; font-weight:700; color:var(--green);">3</div>
      <div style="font-size:11px; color:var(--text-2);">Cerrados</div>
    </div>
  </div>

  <div style="flex:1; overflow:auto; padding:10px 18px 18px; display:flex; flex-direction:column; gap:12px;">

    <div class="card">
      <div style="width:38px; height:38px; border-radius:9px; background:var(--blue-bg); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="1.8"><rect x="3" y="7" width="13" height="10"/><path d="M16 10h3.2a1 1 0 0 1 .9.55L22 14v3h-6"/></svg>
      </div>
      <div style="flex:1;">
        <div style="font-size:13.5px; font-weight:600; color:var(--text);">Entrega &middot; #4</div>
        <div style="font-size:12.5px; color:var(--text-2); margin:2px 0 6px;">Carrera 7 # 45-10, Bogota</div>
        <span class="badge" style="background:var(--amber);">NOVEDAD</span>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2" style="align-self:center;"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div class="card" style="border-color:var(--blue); box-shadow:0 0 0 1px var(--blue);">
      <div style="width:38px; height:38px; border-radius:9px; background:#EDE9FE; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--violet)" stroke-width="1.8"><path d="M7 11V7a5 5 0 0 1 10 0v4"/><rect x="4" y="11" width="16" height="10" rx="2"/></svg>
      </div>
      <div style="flex:1;">
        <div style="font-size:13.5px; font-weight:600; color:var(--text);">Recoleccion &middot; #8</div>
        <div style="font-size:12.5px; color:var(--text-2); margin:2px 0 6px;">Direccion recoleccion test</div>
        <span class="badge" style="background:var(--amber);">EN TRANSITO</span>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2" style="align-self:center;"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div class="card">
      <div style="width:38px; height:38px; border-radius:9px; background:var(--blue-bg); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="1.8"><rect x="3" y="7" width="13" height="10"/><path d="M16 10h3.2a1 1 0 0 1 .9.55L22 14v3h-6"/></svg>
      </div>
      <div style="flex:1;">
        <div style="font-size:13.5px; font-weight:600; color:var(--text);">Entrega &middot; #6</div>
        <div style="font-size:12.5px; color:var(--text-2); margin:2px 0 6px;">Calle Test 123, Bogota</div>
        <span class="badge" style="background:var(--gray);">RECIBIDO EN CENTRO</span>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2" style="align-self:center;"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div class="card" style="opacity:.6;">
      <div style="width:38px; height:38px; border-radius:9px; background:#DCFCE7; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.8"><path d="M7 11V7a5 5 0 0 1 10 0v4"/><rect x="4" y="11" width="16" height="10" rx="2"/></svg>
      </div>
      <div style="flex:1;">
        <div style="font-size:13.5px; font-weight:600; color:var(--text);">Recoleccion &middot; #3</div>
        <div style="font-size:12.5px; color:var(--text-2); margin:2px 0 6px;">Carrera 15 # 80-20</div>
        <span class="badge" style="background:var(--green);">RECOLECTADO</span>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
