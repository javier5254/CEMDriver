<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --blue:#1D4ED8; --blue-dark:#1E3A8A; --blue-bg:#EFF4FF;
      --bg:#F4F6F9; --surface:#FFFFFF; --border:#E2E5EA;
      --text:#14171F; --text-2:#6B7280; --text-3:#9AA1AC;
    }
    *{box-sizing:border-box;}
    body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    a{color:var(--blue);} a:hover{color:var(--blue-dark);}
  </style>
</helmet>

<div style="width:390px; height:844px; background:var(--bg); display:flex; flex-direction:column; overflow:hidden;">

  <!-- Header -->
  <div style="background:var(--blue); padding:22px 20px 18px; display:flex; align-items:center; gap:10px; flex-shrink:0;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="13" height="10"/><path d="M16 10h3.2a1 1 0 0 1 .9.55L22 14v3h-6"/><circle cx="7.5" cy="18.5" r="1.6"/><circle cx="17.5" cy="18.5" r="1.6"/></svg>
    <div style="color:#fff; font-size:19px; font-weight:700; letter-spacing:.2px;">CMEDriver</div>
  </div>

  <!-- Body -->
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; padding:28px;">

    <div style="background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:28px 24px; box-shadow:0 1px 3px rgba(20,23,31,.06);">
      <div style="font-size:20px; font-weight:700; color:var(--text); margin-bottom:4px;">Iniciar sesion</div>
      <div style="font-size:13px; color:var(--text-2); margin-bottom:22px;">Ingresa con tu usuario y contrasena</div>

      <div style="display:flex; flex-direction:column; gap:16px;">
        <div>
          <div style="font-size:12px; font-weight:600; color:var(--text-2); margin-bottom:6px; text-transform:uppercase; letter-spacing:.4px;">Usuario</div>
          <div style="border:1px solid var(--border); border-radius:9px; padding:11px 13px; font-size:14px; color:var(--text); background:#fff;">alistador1</div>
        </div>
        <div>
          <div style="font-size:12px; font-weight:600; color:var(--text-2); margin-bottom:6px; text-transform:uppercase; letter-spacing:.4px;">Contrasena</div>
          <div style="border:1px solid var(--border); border-radius:9px; padding:11px 13px; font-size:14px; color:var(--text); background:#fff; letter-spacing:3px;">&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</div>
        </div>
      </div>

      <div style="margin-top:22px; background:var(--blue); color:#fff; text-align:center; font-weight:700; font-size:15px; padding:13px; border-radius:9px;">Entrar</div>
    </div>

    <div style="margin-top:18px; background:var(--blue-bg); border-radius:10px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2" style="flex-shrink:0; margin-top:2px;"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1" stroke-linecap="round"/></svg>
      <div style="font-size:12px; color:#1e3a8a; line-height:1.5;">
        <strong>Cuentas de demo</strong><br>
        admin / alistador1 / motorizado1 / cliente1<br>
        (misma contrasena que el usuario + "1234")
      </div>
    </div>

  </div>

  <div style="text-align:center; padding:14px; font-size:11px; color:var(--text-3);">CMEDriver &middot; MVP academico &middot; v0.1</div>
</div>
</x-dc>
</body>
</html>
